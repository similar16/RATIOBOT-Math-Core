name: Deploy RATIOBOT to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare full site
        run: |
          rm -rf _site
          mkdir -p _site
          unzip -q RATIOBOT_GitHub_Pages_v4.0.zip -d _site
          if [ -f _site/ratiobot_github_ready/index.html ]; then
            cp -a _site/ratiobot_github_ready/. _site/
            rm -rf _site/ratiobot_github_ready
          fi
          python deploy_patch.py _site
          python browser_hotfix.py _site
          python validate_site.py _site
          test -f _site/index.html
          test -f _site/rings.html
          test -d _site/assets
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
