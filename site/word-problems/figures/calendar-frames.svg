<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 212" role="img" aria-labelledby="title desc"><title id="title">月历透明框</title><desc id="desc">一字框可以横向或竖向框出3个数，十字框可以框出5个数；未预先填写任何日期或总和.</desc><g fill="#3e3540" stroke="#3e3540" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif"><g stroke="none"><rect stroke="#3e3540" x="44" y="100" width="38" height="38" fill="#bd8882" fill-opacity=".16"/><rect stroke="#3e3540" x="82" y="100" width="38" height="38" fill="#bd8882" fill-opacity=".16"/><rect stroke="#3e3540" x="120" y="100" width="38" height="38" fill="#bd8882" fill-opacity=".16"/><rect stroke="#3e3540" x="255" y="25" width="38" height="38" fill="#bd8882" fill-opacity=".16"/><rect stroke="#3e3540" x="255" y="63" width="38" height="38" fill="#bd8882" fill-opacity=".16"/><rect stroke="#3e3540" x="255" y="101" width="38" height="38" fill="#bd8882" fill-opacity=".16"/><rect stroke="#3e3540" x="448" y="25" width="38" height="38" fill="#bd8882" fill-opacity=".16"/><rect stroke="#3e3540" x="410" y="63" width="38" height="38" fill="#bd8882" fill-opacity=".16"/><rect stroke="#3e3540" x="448" y="63" width="38" height="38" fill="#bd8882" fill-opacity=".16"/><rect stroke="#3e3540" x="486" y="63" width="38" height="38" fill="#bd8882" fill-opacity=".16"/><rect stroke="#3e3540" x="448" y="101" width="38" height="38" fill="#bd8882" fill-opacity=".16"/><text x="102" y="176" font-size="19" text-anchor="middle" >横向“一”字框</text><text x="274" y="176" font-size="19" text-anchor="middle" >竖向“一”字框</text><text x="468" y="176" font-size="19" text-anchor="middle" >“十”字框</text></g></g></svg>