<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 175" role="img" aria-labelledby="title desc"><title id="title">菱形纹图案</title><desc id="desc">前3幅分别有1个、2个、3个大菱形，相邻重叠形成小菱形；保持原书叠放方式.</desc><g fill="#3e3540" stroke="#3e3540" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif"><g stroke="none"><g data-pattern="1"><polygon stroke="#3e3540" points="28,66 66,37 104,66 66,95" fill="none"/><text x="66" y="140" font-size="20" text-anchor="middle" >（1）</text></g><g data-pattern="2"><polygon stroke="#3e3540" points="182,66 220,37 258,66 220,95" fill="none"/><polygon stroke="#3e3540" points="224,66 262,37 300,66 262,95" fill="none"/><text x="241" y="140" font-size="20" text-anchor="middle" >（2）</text></g><g data-pattern="3"><polygon stroke="#3e3540" points="392,66 430,37 468,66 430,95" fill="none"/><polygon stroke="#3e3540" points="434,66 472,37 510,66 472,95" fill="none"/><polygon stroke="#3e3540" points="476,66 514,37 552,66 514,95" fill="none"/><text x="472" y="140" font-size="20" text-anchor="middle" >（3）</text></g><text x="594" y="73" font-size="27" text-anchor="middle" >…</text></g></g></svg>