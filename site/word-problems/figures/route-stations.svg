<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" aria-labelledby="title desc"><title id="title">原题路线图</title><desc id="desc">从左至右是王家庄、青山、翠湖、绿水；青山至翠湖50千米，翠湖至绿水70千米；王家庄至翠湖设为x千米.</desc><g fill="#3e3540" stroke="#3e3540" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif"><g stroke="none"><line stroke="#3e3540" x1="45" y1="105" x2="595" y2="105" stroke-width="3"/><line stroke="#3e3540" x1="55" y1="98" x2="55" y2="112" /><text x="55" y="145" font-size="21" text-anchor="middle" >王家庄</text><line stroke="#3e3540" x1="280" y1="98" x2="280" y2="112" /><text x="280" y="145" font-size="21" text-anchor="middle" >青山</text><line stroke="#3e3540" x1="405" y1="98" x2="405" y2="112" /><text x="405" y="145" font-size="21" text-anchor="middle" >翠湖</text><line stroke="#3e3540" x1="580" y1="98" x2="580" y2="112" /><text x="580" y="145" font-size="21" text-anchor="middle" >绿水</text><line stroke="#3e3540" x1="280" y1="66" x2="405" y2="66" /><text x="342" y="50" font-size="20" text-anchor="middle" >50 km</text><line stroke="#3e3540" x1="405" y1="66" x2="580" y2="66" /><text x="492" y="50" font-size="20" text-anchor="middle" >70 km</text><line stroke="#3e3540" x1="55" y1="190" x2="405" y2="190" /><text x="230" y="223" font-size="22" text-anchor="middle" >x km</text></g></g></svg>