3540" x="292" y="76" width="8" height="14" rx="3" fill="#cdbb8d" fill-opacity=".25"/><rect stroke="#3e3540" x="292" y="112" width="8" height="14" rx="3" fill="#cdbb8d" fill-opacity=".25"/><text x="240.0" y="187" font-size="20" text-anchor="middle" >（2）</text></g><g data-pattern="3" data-seats="10"><rect stroke="#3e3540" x="400" y="60" width="40" height="82" fill="none"/><rect stroke="#3e3540" x="413" y="42" width="14" height="8" rx="3" fill="#cdbb8d" fill-opacity=".25"/><rect stroke="#3e3540" x="413" y="152" width="14" height="8" rx="3" fill="#cdbb8d" fill-opacity=".25"/><rect stroke="#3e3540" x="440" y="60" width="40" height="82" fill="none"/><rect stroke="#3e3540" x="453" y="42" width="14" height="8" rx="3" fill="#cdbb8d" fill-opacity=".25"/><rect stroke="#3e3540" x="453" y="152" width="14" height="8" rx="3" fill="#cdbb8d" fill-opacity=".25"/><rect stroke="#3e3540" x="480" y="60" width="40" height="82" fill="none"/><rect stroke="#3e3540" x="493" y="42" width="14" height="8" rx="3" fill="#cdbb8d" fill-opacity=".25"/><rect stroke="#3e3540" x="493" y="152" width="14" height="8" rx="3" fill="#cdbb8d" fill-opacity=".25"/><rect stroke="#3e3540" x="380" y="76" width="8" height="14" rx="3" fill="#cdbb8d" fill-opacity=".25"/><rect stroke="#3e3540" x="380" y="112" width="8" height="14" rx="3" fill="#cdbb8d" fill-opacity=".25"/><rect stroke="#3e3540" x="532" y="76" width="8" height="14" rx="3" fill="#cdbb8d" fill-opacity=".25"/><rect stroke="#3e3540" x="532" y="112" width="8" height="14" rx="3" fill="#cdbb8d" fill-opacity=".25"/><text x="460.0" y="187" font-size="20" text-anchor="middle" >（3）</text></g></g></g></svg>