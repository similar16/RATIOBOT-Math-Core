<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 140" role="img" aria-labelledby="title desc"><title id="title">原题计算程序</title><desc id="desc">输入后依次减2、乘4、加1，然后输出.</desc><g fill="#3e3540" stroke="#3e3540" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif"><g stroke="none"><rect stroke="#3e3540" x="20" y="45" width="100" height="47" rx="4" fill="none"/><text x="70" y="76" font-size="22" text-anchor="middle" >输入</text><line stroke="#3e3540" x1="121" y1="68" x2="140" y2="68" /><path stroke="#3e3540" d="M134 63 L141 68 L134 73" fill="none"/><rect stroke="#3e3540" x="145" y="45" width="100" height="47" rx="4" fill="none"/><text x="195" y="76" font-size="22" text-anchor="middle" >−2</text><line stroke="#3e3540" x1="246" y1="68" x2="265" y2="68" /><path stroke="#3e3540" d="M259 63 L266 68 L259 73" fill="none"/><rect stroke="#3e3540" x="270" y="45" width="100" height="47" rx="4" fill="none"/><text x="320" y="76" font-size="22" text-anchor="middle" >×4</text><line stroke="#3e3540" x1="371" y1="68" x2="390" y2="68" /><path stroke="#3e3540" d="M384 63 L391 68 L384 73" fill="none"/><rect stroke="#3e3540" x="395" y="45" width="100" height="47" rx="4" fill="none"/><text x="445" y="76" font-size="22" text-anchor="middle" >＋1</text><line stroke="#3e3540" x1="496" y1="68" x2="515" y2="68" /><path stroke="#3e3540" d="M509 63 L516 68 L509 73" fill="none"/><rect stroke="#3e3540" x="520" y="45" width="100" height="47" rx="4" fill="none"/><text x="570" y="76" font-size="22" text-anchor="middle" >输出</text></g></g></svg>