<!doctype html><html lang="zh-CN"><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>方程课堂微练习</title><link rel="stylesheet" href="classroom.css"><style>body{padding:clamp(14px,3vw,44px);max-width:1300px;margin:auto}nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}nav select{width:auto}main{margin:18px 0;padding:clamp(16px,3vw,40px);background:var(--paper);border:2px solid var(--ink);border-radius:18px;box-shadow:var(--shadow)}main h2{font-size:clamp(20px,2.4vw,36px)}article,section button,aside{font:clamp(23px,3.2vw,48px) Georgia,"Songti SC",serif;overflow-wrap:anywhere}article,aside{margin:20px 0}section{display:grid;gap:8px}section button{justify-content:flex-start;text-align:left;white-space:normal}button,select{min-height:44px}main>button{margin:8px 6px 0 0}aside{background:var(--mint);padding:12px;border-radius:12px}</style><nav><button onclick="mode=0;reset()">去分母与错例会诊 · 5 分钟</button><button onclick="mode=1;reset()">移项 · 3 分钟</button><select aria-label="题组" onchange="idx=this.selectedIndex;reset()"><option>第1组<option>第2组<option>第3组<option>第4组</select></nav><main id="box"></main><script>const G=[["x/3=(x−1)/2", "2x=3(x−1)", "x/3+1=(x−1)/2", "2x+6=3(x−1)", "(2x+1)/3 − (x−1)/2 = 1", ["2(2x+1) − 3(x−1) = 1", "2(2x+1) − 3x − 1 = 6", "2(2x+1) − 3(x−1) = 6", "4x + 1 − 3x + 3 = 6"], 2, ["右边的 1 乘几？", "−3 乘的是哪个整体？请先恢复括号。", "请展开左边两个乘积，解释最后一个正号。", "2 乘到分子里的 +1 后应得多少？"], "(x−2)/4 − (3x−1)/2 = 1", "(x−2)−2(3x−1)=4", "x−2−6x+2=4"], ["x/4=(x+2)/2", "x=2(x+2)", "2+x/4=(x+2)/2", "8+x=2(x+2)", "2 − (3x−1)/4 = (x+2)/2", ["8−(3x−1)=2(x+2)", "2−(3x−1)=2(x+2)", "8−3x−1=2(x+2)", "8−(3x−1)=2x+2"], 0, ["展开左侧，指出末项符号。", "左侧 2 乘 4 得多少？", "括号外的负号乘到 −1 后得多少？", "右边 2 应乘到哪两项？"], "2−(x−3)/3=(x+1)/6", "12−2(x−3)=x+1", "12−2x+6=x+1"], ["x/6=(x−2)/3", "x=2(x−2)", "x/6=(x−2)/3+1", "x=2(x−2)+6", "(5x−1)/6 − (x−2)/3 = 1", ["5x−1−2(x−2)=1", "5x−1−2x−4=6", "5x−1−(x−2)=6", "5x−1−2(x−2)=6"], 3, ["右侧 1 同乘几？", "−2 乘 −2 后是什么符号？", "6 除以 3 后，分子前应留下几？", "展开第二个乘积并解释末项。"], "(2x+1)/3−(x+3)/2=1", "2(2x+1)−3(x+3)=6", "4x+2−3x−9=6"], ["x/2=(x+2)/5", "5x=2(x+2)", "x/2=2+(x+2)/5", "5x=20+2(x+2)", "x−(x−1)/2=2−(x+2)/5", ["x−5(x−1)=20−2(x+2)", "10x−5(x−1)=20−2(x+2)", "10x−5(x−1)=2−2(x+2)", "10x−5(x−1)=20−2x+4"], 1, ["左侧单独的 x 要乘几？", "展开右侧并解释常数项符号。", "右侧单独的 2 要乘几？", "−2 乘到 +2 后得多少？"], "2x−(x−2)/2=3−(x+1)/4", "8x−2(x−2)=12−(x+1)", "8x−2x+4=12−x−1"]],C=[["4−2x=3x−1", "−2x+4=3x−1", "3x", "减 3x", "−2x−3x+4=−1", "−2x"], ["7−3x=2−5x", "−3x+7=2−5x", "−5x", "加 5x", "−3x+5x+7=2", "−3x"], ["6−x=4x−9", "−x+6=4x−9", "4x", "减 4x", "−x−4x+6=−9", "−x"], ["10−6x=−2x+2", "−6x+10=−2x+2", "−2x", "加 2x", "−6x+2x+10=2", "−6x"]];let idx=0,mode=0,n=0,k=0,show=false;function reset(){n=0;show=false;draw()}function go(v){n+=v;show=false;draw()}function fmt(s){return s.replace(/(\([^()]+\)|[0-9]*x)\/(\d+)/g,(_,a,b)=>'<math><mfrac><mtext>'+a.replace(/^\((.*)\)$/,'$1')+'</mtext><mn>'+b+'</mn></mfrac></math>')}function draw(){document.querySelectorAll("nav button").forEach((b,i)=>b.classList.toggle("active",i===mode));let g=G[idx],c=C[idx],t,q,ans='',opts='',end=mode?3:4;if(mode){t=['① 只交换左边两项的位置，带上符号','② 只移右边的 '+c[2]+'。写出两边同时做什么，再写一行','③ 框住留在左边的负项，划出由右侧移来的项','④ 从原式独立重写移项的一行'][n];q=[c[0],c[1],c[4],c[0]][n];ans=[c[1],'两边同时'+c[3]+'　'+c[4],'原位项 '+c[5]+'　移来后 '+(c[2].startsWith('−')?'+'+c[2].slice(1):'−'+c[2]),c[4]][n]}else{t=['① 只写去分母的一行','② 增加一项，再写去分母的一行','③ 全班同时投票。教师点选要讨论的选项','同题会诊 · '+ 'ABCD'[k] +' 项','同构仿练 · 独立写前两行'][n];q=[g[0],g[2],g[4],g[4],g[8]][n];ans=[g[1],g[3],'',g[5][g[6]],g[9]+'<br>'+g[10]][n];if(n===2)opts=g[5].map((v,i)=>'<button onclick="k='+i+';go(1)">'+'ABCD'[i]+'　'+v+'</button>').join('');if(n===3)opts='<p>'+g[5][k]+'</p><p>'+g[7][k]+'</p>'}box.innerHTML='<h2>'+t+'</h2><article>'+fmt(q)+'</article><section>'+opts+'</section>'+(show?'<aside>核对　'+ans+'</aside>':'')+(ans?'<button onclick="show=!show;draw()">'+(show?'收起核对':'揭晓核对')+'</button>':'')+(n?'<button onclick="go(-1)">上一步</button>':'')+(n<end&&(mode||n!==2)?'<button onclick="go(1)">下一步</button>':'')+(n===end?'<button onclick="reset()">重做本组</button>':'')}draw()</script></html>
